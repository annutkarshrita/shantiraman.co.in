<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shantiraman</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 12px 35px rgba(0,0,0,.28);
            text-align: center;
        }
        .logo {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            background: #fff;
            margin-bottom: 12px;
        }
        h1 { margin: 0 0 6px; color: #2c3e50; font-size: 28px; }
        .subtitle { margin: 0 0 25px; color: #666; }
        label {
            display: block;
            text-align: left;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 18px;
        }
        button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 13px;
            background: #e74c3c;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #c0392b; }
        .back {
            display: inline-block;
            margin-top: 18px;
            color: #2c3e50;
            text-decoration: none;
        }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="Shantiramanlogo.png" alt="Shantiraman Logo" class="logo">
        <h1>Shantiraman ERP Login</h1>
        <p class="subtitle">अपने School ERP में Login करें</p>

        <label for="schoolSelect">School Select करें</label>
        <select id="schoolSelect">
            <option value="">-- Select School --</option>
            <option value="ramraji">RAMRAJI SARASWATI BALIKA VIDYA MANDIR INTER COLLEGE</option>
        </select>

        <button type="button" onclick="openERP()">Continue to Login</button>

        <a href="index.html" class="back">← मुख्य पेज पर वापस जाएँ</a>
    </div>

    <script>
        function openERP() {
            const school = document.getElementById("schoolSelect").value;

            if (!school) {
                alert("कृपया पहले School Select करें।");
                return;
            }

            window.location.href = "https://login.shantiraman.co.in";
        }
    </script>
</body>
</html>
