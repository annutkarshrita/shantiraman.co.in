<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Shantiraman ERP</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Segoe UI',Tahoma,Arial,sans-serif;
background:linear-gradient(135deg,#2c3e50,#3498db);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:430px;background:#fff;border-radius:18px;padding:32px;
box-shadow:0 12px 35px rgba(0,0,0,.28);text-align:center}
.logo{width:90px;height:90px;object-fit:cover;border-radius:50%;background:#fff;margin-bottom:12px}
h1{margin:0 0 6px;color:#2c3e50;font-size:28px}
.school-name{margin:0 0 5px;color:#111;font-weight:700;font-size:16px}
.subtitle{margin:0 0 25px;color:#666}
label{display:block;text-align:left;font-weight:600;margin-bottom:8px;color:#333}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:15px;margin-bottom:18px;background:#fff}
button{width:100%;border:0;border-radius:8px;padding:13px;background:#193b68;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#142f54}
.back{display:inline-block;margin-top:18px;color:#193b68;text-decoration:none;font-weight:600}
.back:hover{text-decoration:underline}
.msg{padding:10px;border-radius:7px;margin-bottom:15px;font-size:14px}
.error{background:#fde8e8;color:#b42318}
.success{background:#e8f7ee;color:#18794e}
.note{margin-top:16px;font-size:13px;color:#777}

.role-title{text-align:left;font-weight:700;color:#334155;margin-bottom:12px}
.role-options{display:grid;grid-template-columns:1fr;gap:11px}
.role-option{
  width:100%;border:1px solid #dfe8f2;background:#fff;border-radius:15px;
  padding:15px 17px;cursor:pointer;display:flex;align-items:center;gap:13px;
  font-weight:800;color:#0b1f3a;text-align:left;font-size:16px;
  transition:.18s ease;
}
.role-option:hover{border-color:#2d79d7;background:#f4f8ff;transform:translateY(-1px)}
.role-icon{
  width:42px;height:42px;border-radius:12px;background:#edf5ff;
  display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 42px;
}
#loginFields{display:none}
.selected-info{
  margin:0 0 18px;padding:10px 12px;border-radius:10px;
  background:#eef5ff;color:#193b68;font-size:13px;font-weight:700;
}
.change-role{
  background:none;color:#193b68;padding:7px 0;margin:0 0 8px;
  font-size:13px;width:auto;
}
.change-role:hover{background:none;text-decoration:underline}
</style>
</head>
<body>

<div class="login-card">

<img src="/Shatiramanlogo.jpg" alt="Shantiraman Logo" class="logo"
     onerror="this.style.display='none'">

<h1>Shantiraman ERP</h1>
<p class="school-name">{{ school_name or session.get('school_name','School ERP') }}</p>
<p class="subtitle">Login / Select School</p>

{% if error %}
<div class="msg error">{{ error }}</div>
{% endif %}
{% if reset_success %}
<div class="msg success">{{ reset_success }}</div>
{% endif %}

<!-- पहले Role चुनें -->
<div id="roleChooser">
    <div class="role-title">अपना Role चुनें</div>

    <div class="role-options">
        <button type="button" class="role-option" onclick="selectRole('classteacher','Class Teacher')">
            <span class="role-icon">👩‍🏫</span>
            <span>Class Teacher</span>
        </button>

        <button type="button" class="role-option" onclick="selectRole('teacher','Teacher')">
            <span class="role-icon">📚</span>
            <span>Teacher</span>
        </button>

        <button type="button" class="role-option" onclick="selectRole('admin','Admin')">
            <span class="role-icon">⚙️</span>
            <span>Admin</span>
        </button>
    </div>
</div>

<!-- Role चुनने के बाद Login form -->
<div id="loginFields">

    <div id="selectedRole" class="selected-info"></div>

    <button type="button" class="change-role" onclick="changeRole()">← Role बदलें</button>

    <form method="POST" action="/login">

        <input type="hidden" id="role" name="role"
               value="{{ request.args.get('role', session.get('login_role','')) }}">

        <label for="email">User Name / Email ID</label>
        <input type="text" id="email" name="email"
               placeholder="अपनी Email ID डालें" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Password डालें" required>

        <button type="submit">Login</button>
    </form>
</div>

<a href="/forgot-password" class="back">Forgot Password?</a><br>
<a href="/select-school" class="back">← School बदलें</a>

<p class="note">Shantiraman ERP Mobile</p>
</div>

<script>
function selectRole(role, roleName){
    document.getElementById("role").value = role;
    document.getElementById("selectedRole").textContent = "Selected Role: " + roleName;
    document.getElementById("roleChooser").style.display = "none";
    document.getElementById("loginFields").style.display = "block";
}

function changeRole(){
    document.getElementById("loginFields").style.display = "none";
    document.getElementById("roleChooser").style.display = "block";
}

document.addEventListener("DOMContentLoaded", function(){
    const role = document.getElementById("role").value;
    if(role){
        const names = {
            classteacher:"Class Teacher",
            teacher:"Teacher",
            admin:"Admin"
        };
        document.getElementById("selectedRole").textContent =
            "Selected Role: " + (names[role] || role);
        document.getElementById("roleChooser").style.display = "none";
        document.getElementById("loginFields").style.display = "block";
    }
});
</script>

</body>
</html>
