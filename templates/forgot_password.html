<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password</title>
<style>body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0}.box{max-width:420px;margin:50px auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 4px 18px #0001}h2{text-align:center;color:#17365d}.school{text-align:center;color:#666;margin-bottom:20px}.error{background:#fde8e8;color:#b91c1c;padding:10px;border-radius:8px;margin-bottom:12px}.info{background:#eef6ff;color:#17365d;padding:10px;border-radius:8px;margin-bottom:12px}label{display:block;font-weight:bold;margin:12px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;font-size:15px}input{border:1px solid #bbb}button{margin-top:18px;border:0;background:#17365d;color:#fff;font-weight:bold;cursor:pointer}.back{text-align:center;margin-top:15px}.back a{color:#17365d;font-weight:bold;text-decoration:none}</style></head>
<body><div class="box"><h2>Forgot Password</h2><div class="school">{{ school_name }}</div>{% if error %}<div class="error">{{ error }}</div>{% endif %}{% if stage=='email' %}<div class="info">अपनी registered Email ID डालें। OTP Email पर भेजा जाएगा।</div><form method="post"><label>Email ID</label><input type="email" name="email" value="{{ email or '' }}" required><button type="submit">Send OTP</button></form>{% elif stage=='otp' %}<div class="info">OTP: {{ email }}</div><form method="post"><label>OTP</label><input type="text" name="otp" inputmode="numeric" maxlength="6" required><button type="submit">Verify OTP</button></form>{% elif stage=='reset' %}<form method="post"><label>New Password</label><input type="password" name="new_password" minlength="6" required><label>Confirm Password</label><input type="password" name="confirm_password" minlength="6" required><button type="submit">Reset Password</button></form>{% endif %}<div class="back"><a href="{{ url_for('home') }}">Login पर वापस जाएँ</a></div></div></body></html>
