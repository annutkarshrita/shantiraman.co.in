<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shantiraman Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#eef3f8;color:#222}
.top{background:#28558c;color:white;padding:15px 18px}
.top h2{margin:0}
.container{max-width:900px;margin:auto;padding:16px}
.welcome,.card{background:white;border-radius:14px;box-shadow:0 2px 10px #d9dee5}
.welcome{padding:18px}
.welcome h3{margin:0 0 10px;color:#28558c}
.info{margin:6px 0}
.menu-title{font-size:18px;font-weight:bold;margin:20px 2px 10px;color:#28558c}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{border:0;padding:20px 10px;min-height:110px;text-align:center;font-size:15px;font-weight:bold;cursor:pointer}
.icon{font-size:30px;display:block;margin-bottom:8px}
.logout{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#c0392b;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.school{font-size:14px;margin-top:4px}
@media(min-width:650px){.menu{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<div class="top">
    <h2>Shantiraman</h2>
    <div>Mobile Dashboard</div>
    <div class="school">{{ school_name }}</div>
</div>

<div class="container">

    <div class="welcome">
        <h3>नमस्कार, {{ teacher_name }}</h3>
        <div class="info"><b>Designation:</b> {{ designation }}</div>
        <div class="info"><b>Role:</b> {{ role }}</div>
    </div>

    <div class="menu-title">मुख्य मेनू</div>

    <div class="menu">
        <button class="card" onclick="location.href='{{ url_for("exam_marks") }}'">
            <span class="icon">📝</span>
            Exam / Marks
        </button>

        <button class="card" onclick="location.href='{{ url_for("my_students") }}'">
            <span class="icon">👨‍🎓</span>
            My Students
        </button>

        <button class="card" onclick="location.href='{{ url_for("attendance") }}'">
            <span class="icon">📅</span>
            Attendance
        </button>

        <button class="card" onclick="location.href='{{ url_for("my_result") }}'">
            <span class="icon">📊</span>
            My Result
        </button>

        <button class="card" onclick="location.href='{{ url_for("my_profile") }}'">
            <span class="icon">👤</span>
            My Profile
        </button>

        <button class="card" onclick="location.href='{{ url_for("my_fee") }}'">
            <span class="icon">💰</span>
            My Fee
        </button>
    </div>

    <button class="logout" onclick="location.href='{{ url_for("logout") }}'">
        Logout
    </button>

</div>
</body>
</html>
